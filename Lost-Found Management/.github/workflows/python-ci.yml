name: Python CI

on:
  push:
    branches:
      - main
      - mamta-dashboard
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Lost-Found Management/requirements.txt"
          pip install pytest

      - name: Check Python syntax
        run: |
          python -m py_compile "Lost-Found Management/app.py"

      - name: Run tests
        working-directory: "Lost-Found Management"
        run: python -m pytest -q
